services:
  app:
    image: ghcr.io/nikitababenko/shortlink@sha256:3064194fec73afe3229172d9d9a146b4f35dad4c9bfc7a7a1688dd9b73f02728
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  app_data:
