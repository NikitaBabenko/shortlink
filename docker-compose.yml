services:
  app:
    build:
      context: .
      dockerfile: deploy/vibenest/Dockerfile.prebuilt
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  app_data:
